version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /editors/vscode/zlang-hdl
    # The JS static gate requires the TypeScript 6 compiler API. TypeScript 7
    # supplies a native CLI, not that API; qualify an API migration separately.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
