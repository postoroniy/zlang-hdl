name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact test tooling and ZLang HDL
        run: >-
          python -m pip install --disable-pip-version-check
          -e '.[test]'
          build==1.3.0
          pip-audit==2.10.1
          reuse==5.1.1
          ruff==0.12.12
          setuptools==84.0.0
          twine==6.2.0
          wheel==0.46.3
      - name: Audit and install the reviewed Linux native wheel
        run: |
          python tools/audit_native_binary.py \
            --expected-version "$(python -c 'from zlang._version import __version__; print(__version__)')" \
            release/native-wheels/*manylinux_2_28_x86_64.whl
          python -m pip install --disable-pip-version-check \
            release/native-wheels/*manylinux_2_28_x86_64.whl
      - name: Validate release status
        run: |
          python tools/release_status.py check --root .
      - name: Static correctness
        run: |
          python -m ruff check --select E9,F63,F7,F82 zlang tests tools
          python -m compileall -q zlang tests tools
          reuse lint
          pip-audit . --progress-spinner off
          git diff --check
      - name: Fast compiler and packaging regression
        run: >-
          python -m pytest -n 8 --dist=loadscope -q
          tests/parser
          tests/semantic
          tests/conformance
          tests/editor
          tests/packaging
          tests/release
      - name: Build and inspect distributions
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*

  lexical-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the Community language server for host testing
        run: python -m pip install --disable-pip-version-check -e .
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: editors/vscode/zlang-hdl/package-lock.json
      - name: Install locked editor tooling without lifecycle scripts
        working-directory: editors/vscode/zlang-hdl
        run: npm ci --ignore-scripts
      - name: Exercise real TextMate and Oniguruma tokenization
        working-directory: editors/vscode/zlang-hdl
        run: npm test
      - name: Build the Community VSIX in temporary storage
        working-directory: editors/vscode/zlang-hdl
        run: npm run package -- "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix"
      - name: Audit actual VSIX contents, licensing and package identity
        run: >-
          python tests/editor/test_vscode_package.py "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix"
          > "$RUNNER_TEMP/zlang-hdl-0.1.0-audit.json"
      - name: Exercise the installed VSIX on the pinned current stable host
        working-directory: editors/vscode/zlang-hdl
        run: >-
          xvfb-run -a npm run test:host --
          "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix"
      - name: Retain the successfully audited Community VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zlang-hdl-0.1.0-vsix
          path: |
            ${{ runner.temp }}/zlang-hdl-0.1.0.vsix
            ${{ runner.temp }}/zlang-hdl-0.1.0-audit.json
          if-no-files-found: error
          retention-days: 14

  random-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [expressions, diagnostics]
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: "2026-09-22"
      - name: Install public compiler
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run reproducible PR random cases
        run: >-
          python tools/random_regression.py
          --suite "${{ matrix.suite }}"
          --master-seed pr-20260923-v1
          --tests 128
          --save-failures build/random-failures
      - name: Retain random failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: random-pr-${{ matrix.suite }}-${{ github.run_id }}
          path: build/random-failures/
          if-no-files-found: warn
          retention-days: 14

  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: "2026-09-22"
      - name: Install public compiler and audited Linux native wheel
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]' \
            release/native-wheels/*manylinux_2_28_x86_64.whl \
            build==1.3.0
          python tools/audit_native_binary.py \
            --expected-version "$(python -c 'from zlang._version import __version__; print(__version__)')" \
            release/native-wheels/*manylinux_2_28_x86_64.whl
      - name: Record and require the open EDA toolchain
        run: |
          verilator --version
          iverilog -V
          yosys -V
          sby --version
          z3 --version
          python tools/release_status.py check --root . --check-tools
      - name: Run complete public regression with no skips
        run: |
          mkdir -p build
          python -m pytest -p tools.pytest_no_skips -n 4 --dist=loadscope -q \
            --junitxml=build/ci-full.xml
          python tools/release_status.py check --root . --junit build/ci-full.xml
      - name: Retain full regression report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-full-${{ github.run_id }}
          path: build/ci-full.xml
          if-no-files-found: warn
          retention-days: 14

  hosted-edge-regression:
    # These cases exposed host-specific LSP shutdown, formal trace, and
    # package-builder failures that a local compiler-only gate missed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: "2026-09-22"
      - name: Install public compiler and package builder
        run: python -m pip install --disable-pip-version-check -e '.[test]' build==1.3.0
      - name: Recheck hosted lifecycle, formal counterexample, and packaging
        run: |
          mkdir -p build
          python -m pytest -p tools.pytest_no_skips -q \
            tests/lsp/test_server.py::test_stdio_transport_argument_starts_a_real_json_rpc_process \
            'tests/integration/test_verification_examples.py::test_real_verification_examples_and_rare_bug_shallow_replay[rare_overflow_bug]' \
            tests/packaging/test_stdlib_packaging.py::test_wheel_contains_and_resolves_every_shipped_stdlib_module \
            --junitxml=build/hosted-edge.xml
      - name: Retain hosted edge failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-edge-${{ github.run_id }}
          path: |
            build/hosted-edge.xml
            /tmp/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/report.json
            /tmp/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/work/**/*.vcd
            /tmp/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/work/**/*.log
          if-no-files-found: warn
          retention-days: 14

  fast:
    # The protected main ruleset already requires the check named "fast".
    # Keep that name as the aggregate result, so random/full/editor failures
    # cannot be bypassed by a successful small test subset.
    if: always()
    needs: [fast-core, full-regression, random-smoke, lexical-editor, hosted-edge-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every public PR acceptance lane
        env:
          FAST_CORE: ${{ needs['fast-core'].result }}
          FULL: ${{ needs['full-regression'].result }}
          RANDOM: ${{ needs['random-smoke'].result }}
          EDITOR: ${{ needs['lexical-editor'].result }}
          HOSTED_EDGE: ${{ needs['hosted-edge-regression'].result }}
        run: |
          test "$FAST_CORE" = success
          test "$FULL" = success
          test "$RANDOM" = success
          test "$EDITOR" = success
          test "$HOSTED_EDGE" = success
