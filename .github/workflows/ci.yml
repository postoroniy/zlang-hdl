name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BASH_ENV: ${{ github.workspace }}/.github/workflows/local-venv-env.sh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up PDF inspection tools
        uses: ./.github/actions/setup-pdf-tools
      - name: Bootstrap the repository-owned test environment
        run: make -s ci-bootstrap
      - name: Audit and install the reviewed Linux native wheel
        run: make -s native-release-install
      - name: Run the canonical fast acceptance lane
        run: make -s ci-fast-core WORKERS=8

  lexical-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap the repository-owned editor environment
        run: make -s ci-bootstrap
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: editors/vscode/zlang-hdl/package-lock.json
      - name: Test, package, audit, and exercise the Community VSIX
        run: >-
          make -s ci-editor
          CI_VSIX="$RUNNER_TEMP/zlang-hdl-0.1.0.vsix"
      - name: Retain the successfully audited Community VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zlang-hdl-0.1.0-vsix
          path: |
            ${{ runner.temp }}/zlang-hdl-0.1.0.vsix
            ${{ runner.temp }}/zlang-hdl-0.1.0.vsix.audit.json
          if-no-files-found: error
          retention-days: 14

  random-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [expressions, diagnostics]
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          github-token: ${{ github.token }}
          version: "2026-09-22"
      - name: Bootstrap the repository-owned random-test environment
        run: make -s ci-bootstrap
      - name: Run reproducible PR random cases
        run: >-
          make -s ci-random-smoke
          CI_RANDOM_SUITE="${{ matrix.suite }}"
          CI_RANDOM_MASTER_SEED=pr-20260923-v1
          CI_RANDOM_TESTS=128
      - name: Retain random failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: random-pr-${{ matrix.suite }}-${{ github.run_id }}
          path: build/random-failures/
          if-no-files-found: warn
          retention-days: 14

  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          github-token: ${{ github.token }}
          version: "2026-09-22"
      - name: Set up PDF inspection tools
        uses: ./.github/actions/setup-pdf-tools
      - name: Bootstrap the repository-owned regression environment
        run: make -s ci-bootstrap
      - name: Audit and install the reviewed Linux native wheel
        run: make -s native-release-install
      - name: Run complete public regression with no skips
        run: >-
          make -s ci-full-regression
          WORKERS=4
          CI_JUNIT=build/ci-full.xml
      - name: Retain deterministic regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-${{ github.run_id }}-deterministic
          path: build/ci-full.xml
          if-no-files-found: warn
          retention-days: 14

  performance-regression:
    # Wall/RSS ceilings require an otherwise idle runner. Running this test
    # beside compiler workers measures scheduler contention, not scalability.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          github-token: ${{ github.token }}
          version: "2026-09-22"
      - name: Set up PDF inspection tools
        uses: ./.github/actions/setup-pdf-tools
      - name: Bootstrap the repository-owned performance environment
        run: make -s ci-bootstrap
      - name: Audit and install the reviewed Linux native wheel
        run: make -s native-release-install
      - name: Run isolated bounded performance regressions
        run: >-
          make -s ci-performance-regression
          CI_JUNIT=build/ci-performance.xml
      - name: Retain performance regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-${{ github.run_id }}-performance
          path: build/ci-performance.xml
          if-no-files-found: warn
          retention-days: 14

  hosted-edge-regression:
    # These cases exposed host-specific LSP shutdown, formal trace, and
    # package-builder failures that a local compiler-only gate missed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          github-token: ${{ github.token }}
          version: "2026-09-22"
      - name: Bootstrap the repository-owned hosted-edge environment
        run: make -s ci-bootstrap
      - name: Recheck hosted lifecycle, formal counterexample, and packaging
        env:
          KEEP_TMP: "1"
        run: make -s ci-hosted-edge CI_JUNIT=build/hosted-edge.xml
      - name: Retain hosted edge failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-edge-${{ github.run_id }}
          path: |
            build/hosted-edge.xml
            build/tmp/ci-hosted-edge.*/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/report.json
            build/tmp/ci-hosted-edge.*/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/work/**/*.vcd
            build/tmp/ci-hosted-edge.*/pytest-of-runner/pytest-*/verify-example-rare_overflow_bug*/work/**/*.log
          if-no-files-found: warn
          retention-days: 14

  fast:
    # The protected main ruleset already requires the check named "fast".
    # Keep that name as the aggregate result, so random/full/editor failures
    # cannot be bypassed by a successful small test subset.
    if: always()
    needs: [fast-core, full-regression, performance-regression, random-smoke, lexical-editor, hosted-edge-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact public snapshot for aggregate validation
        if: needs.full-regression.result == 'success' && needs.performance-regression.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12 for aggregate validation
        if: needs.full-regression.result == 'success' && needs.performance-regression.result == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download deterministic and performance reports
        if: needs.full-regression.result == 'success' && needs.performance-regression.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-suite-${{ github.run_id }}-*
          path: build/ci-suites
          merge-multiple: true
      - name: Validate the complete split-suite release floor
        if: needs.full-regression.result == 'success' && needs.performance-regression.result == 'success'
        run: >-
          make -s ci-test-floor
          CI_DETERMINISTIC_JUNIT=build/ci-suites/ci-full.xml
          CI_PERFORMANCE_JUNIT=build/ci-suites/ci-performance.xml
      - name: Require every public PR acceptance lane
        env:
          FAST_CORE: ${{ needs['fast-core'].result }}
          FULL: ${{ needs['full-regression'].result }}
          PERFORMANCE: ${{ needs['performance-regression'].result }}
          RANDOM_SMOKE: ${{ needs['random-smoke'].result }}
          EDITOR: ${{ needs['lexical-editor'].result }}
          HOSTED_EDGE: ${{ needs['hosted-edge-regression'].result }}
        run: |
          test "$FAST_CORE" = success
          test "$FULL" = success
          test "$PERFORMANCE" = success
          test "$RANDOM_SMOKE" = success
          test "$EDITOR" = success
          test "$HOSTED_EDGE" = success
