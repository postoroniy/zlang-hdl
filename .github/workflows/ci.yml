name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate immutable public checkout
        run: |
          python tools/public_tree.py check-source --source .
          python tools/public_tree.py check-export --source .
      - name: Install exact test tooling and ZLang
        run: >-
          python -m pip install --disable-pip-version-check
          -e '.[test]'
          build==1.3.0
          pip-audit==2.10.1
          reuse==5.1.1
          ruff==0.12.12
          setuptools==84.0.0
          twine==6.2.0
          wheel==0.46.3
      - name: Validate public source projection and release status
        run: |
          python tools/release_status.py check --root .
      - name: Static correctness
        run: |
          python -m ruff check --select E9,F63,F7,F82 zlang tests tools
          python -m compileall -q zlang tests tools
          reuse lint
          pip-audit . --progress-spinner off
          git diff --check
      - name: Fast compiler and packaging regression
        run: >-
          python -m pytest -n 8 --dist=loadscope -q
          tests/parser
          tests/semantic
          tests/conformance
          tests/editor
          tests/packaging
          tests/release
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify compact snapshot is self-contained
        run: |
          public_dir="$(mktemp -d)"
          python tools/public_tree.py export --source . --destination "$public_dir"
          python "$public_dir/tools/public_tree.py" check-export --source "$public_dir"
