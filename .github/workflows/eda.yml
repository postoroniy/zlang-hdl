name: Pinned EDA acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-tools:
    # Trusted main acceptance uses a disposable GitHub-hosted runner.
    if: github.repository == 'postoroniy/zlang-hdl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out public snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned open EDA tools
        uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: "2026-09-22"
      - name: Install ZLang HDL and the compatible prebuilt native runtime
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]' \
            release/native-wheels/*manylinux_2_28_x86_64.whl \
            build==1.3.0
          python tools/audit_native_binary.py \
            --expected-version "$(python -c 'from zlang._version import __version__; print(__version__)')" \
            release/native-wheels/*manylinux_2_28_x86_64.whl
      - name: Require the frozen EDA toolchain
        run: |
          python tools/release_status.py check --root . --check-tools
      - name: Run the complete regression with no unexpected skips
        run: |
          mkdir -p build
          python -m pytest -p tools.pytest_no_skips \
            -n 8 --dist=loadscope -q --junitxml=build/eda.xml
          python tools/release_status.py check --root . --junit build/eda.xml
