name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install, self-test, and run pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ARCHIVE_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir"
          test "$("$binary_dir/gitleaks" version)" = "$GITLEAKS_VERSION"

          fixture="$(mktemp -d)"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' \
              'MIIEowIBAAKCAQEA0FAKE0FAKE0FAKE0FAKE0FAKE0FAKE0FAKE0FAKE0FAKE0'
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$fixture/seed.txt"
          scan_status=0
          "$binary_dir/gitleaks" dir "$fixture" --redact --no-banner \
            --exit-code 99 || scan_status=$?
          if test "$scan_status" -ne 99; then
            echo "Gitleaks self-test failed to detect the seeded fake secret" >&2
            exit 1
          fi

          "$binary_dir/gitleaks" git . --redact --no-banner
