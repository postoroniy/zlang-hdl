name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify annotated tag and GitHub signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          object_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.type)"
          test "$object_type" = tag
          tag_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          tag_commit="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha" --jq .object.sha)"
          test "$(gh api "repos/$REPOSITORY/git/tags/$tag_sha" --jq .verification.verified)" = true
          test "$(gh api "repos/$REPOSITORY/git/tags/$tag_sha" --jq .verification.reason)" = valid
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$(git rev-parse origin/main)" = "$tag_commit"
      - name: Validate immutable public checkout
        run: |
          python tools/public_tree.py check-source --source .
          python tools/public_tree.py check-export --source .
      - name: Install exact release tooling and ZLang HDL
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check \
            -e '.[test]' \
            build==1.3.0 \
            cyclonedx-bom==7.0.0 \
            pip-audit==2.10.1 \
            reuse==5.1.1 \
            setuptools==84.0.0 \
            twine==6.2.0 \
            wheel==0.46.3
      - name: Validate public tree
        run: |
          python tools/release_status.py check --root . --tag "$GITHUB_REF_NAME"
          reuse lint
          pip-audit . --progress-spinner off
      - name: Build one sdist and a byte-reproducible wheel
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p build/dist-first build/dist-second
          python -m build --no-isolation --sdist --outdir build/dist-first
          python -m build --no-isolation --wheel --outdir build/dist-first
          python -m build --no-isolation --wheel --outdir build/dist-second
          sha256sum build/dist-first/*.whl | sed 's#build/dist-first/##' > build/first-wheel.sha256
          sha256sum build/dist-second/*.whl | sed 's#build/dist-second/##' > build/second-wheel.sha256
          diff -u build/first-wheel.sha256 build/second-wheel.sha256
          mkdir -p dist
          cp build/dist-first/* dist/
          python -m twine check dist/*
          python -m venv --without-pip build/wheel-venv
          python -m pip --python build/wheel-venv/bin/python install \
            --disable-pip-version-check pip==26.2.1 dist/*.whl
          build/wheel-venv/bin/python -m pip check
          python -m venv --without-pip build/sdist-venv
          python -m pip --python build/sdist-venv/bin/python install \
            --disable-pip-version-check pip==26.2.1 dist/*.tar.gz
          build/sdist-venv/bin/python -m pip check
          smoke_dir="$PWD/build/package-smoke"
          mkdir -p "$smoke_dir"
          printf '%s\n' \
            'import std.math.complex' \
            'module PackageSmoke { in x:u8 out y:u8 y=x }' \
            > "$smoke_dir/package-smoke.zhl"
          for environment in "$PWD/build/wheel-venv" "$PWD/build/sdist-venv"; do
            test "$("$environment/bin/zlang" --version)" = "zlang ${GITHUB_REF_NAME#v}"
            test "$("$environment/bin/zlang-lock" --version)" = "zlang-lock ${GITHUB_REF_NAME#v}"
            test "$("$environment/bin/zlang-verify" --version)" = "zlang-verify ${GITHUB_REF_NAME#v}"
            (cd "$smoke_dir" && "$environment/bin/zlang" package-smoke.zhl --check)
          done
          for kind in wheel sdist; do
            printf 'zlang-hdl==%s\n' "${GITHUB_REF_NAME#v}" > "build/$kind-requirements.txt"
            "build/$kind-venv/bin/python" -m pip freeze --all --exclude zlang-hdl \
              | LC_ALL=C sort >> "build/$kind-requirements.txt"
          done
          diff -u build/wheel-requirements.txt build/sdist-requirements.txt
          cp build/wheel-requirements.txt dist/release-requirements.txt
      - name: Audit the exact published dependency and installer inventory
        run: |
          python tools/release_inventory.py \
            --requirements dist/release-requirements.txt \
            --project-version "${GITHUB_REF_NAME#v}" \
            --report build/release-inventory-audit.json
      - name: Set up pinned Node.js for the lexical extension
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: editors/vscode/zlang-hdl/package-lock.json
      - name: Install locked editor tooling without lifecycle scripts
        working-directory: editors/vscode/zlang-hdl
        run: npm ci --ignore-scripts
      - name: Require a fresh full locked editor advisory audit
        working-directory: editors/vscode/zlang-hdl
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/build/editor-npm-audit.json"
          npm audit --package-lock-only --include=dev --include=optional --include=peer \
            --audit-level=info --json > "$report"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (not isinstance(report, dict) or report.get("auditReportVersion") != 2
                  or "error" in report or report.get("vulnerabilities") != {}):
              raise SystemExit("Editor advisory audit is incomplete or has findings")
          metadata = report.get("metadata", {})
          counts = metadata.get("vulnerabilities", {})
          for severity in ("info", "low", "moderate", "high", "critical", "total"):
              if type(counts.get(severity)) is not int or counts[severity] != 0:
                  raise SystemExit("Editor advisory audit has findings or missing totals")
          dependencies = metadata.get("dependencies", {})
          for kind in ("dev", "total"):
              if type(dependencies.get(kind)) is not int or dependencies[kind] <= 0:
                  raise SystemExit("Editor advisory audit did not include build tooling")
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          packages = lock.get("packages")
          if lock.get("lockfileVersion") != 3 or not isinstance(packages, dict) or "" not in packages:
              raise SystemExit("Editor lockfile inventory is incomplete")
          if dependencies["total"] != len(packages) - 1:
              raise SystemExit("Editor advisory audit does not cover the full lockfile")
          print(f"Editor advisory audit: {dependencies['total']} locked dependencies, "
                f"including {dependencies['dev']} dev dependencies; zero findings")
          PY
      - name: Exercise real TextMate and Oniguruma tokenization
        working-directory: editors/vscode/zlang-hdl
        run: npm test
      - name: Build and audit the exact-tag static lexical VSIX
        shell: bash
        run: |
          npm --prefix editors/vscode/zlang-hdl run package -- "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix"
          python tests/editor/test_vscode_package.py "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix" \
            > "$RUNNER_TEMP/zlang-hdl-0.1.0-vsix-audit.json"
          cp -- "$RUNNER_TEMP/zlang-hdl-0.1.0.vsix" \
            "$RUNNER_TEMP/zlang-hdl-0.1.0-vsix-audit.json" dist/
      - name: Retain accepted dependency audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-dependency-audits
          path: |
            build/release-inventory-audit.json
            build/editor-npm-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Build release SBOM and checksums after inventory acceptance
        shell: bash
        run: |
          cyclonedx-py requirements dist/release-requirements.txt \
            --output-reproducible \
            --output-format JSON \
            --output-file "dist/zlang-hdl-${GITHUB_REF_NAME}.cdx.json"
          (cd dist && sha256sum zlang_hdl-*.whl zlang_hdl-*.tar.gz \
            zlang-hdl-*.cdx.json release-requirements.txt \
            zlang-hdl-*.vsix zlang-hdl-*-vsix-audit.json | sort > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload reviewed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  eda:
    # Verify that the signed release tag points to main before using the runner.
    needs: validate
    runs-on: [self-hosted, linux, x64, zlang-eda]
    timeout-minutes: 240
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable public checkout
        run: python tools/public_tree.py check-export --source .
      - name: Install release test environment and require the EDA toolchain
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -e '.[test]'
          python tools/release_status.py check --root . --check-tools
      - name: Run full regression twice with no unexpected skips
        run: |
          mkdir -p build
          python -m pytest -p tools.pytest_no_skips \
            -n 8 --dist=loadscope -q --junitxml=build/release-1.xml
          python tools/release_status.py check --root . --junit build/release-1.xml
          python -m pytest -p tools.pytest_no_skips \
            -n 8 --dist=loadscope -q --junitxml=build/release-2.xml
          python tools/release_status.py check --root . --junit build/release-2.xml

  publish:
    needs: [validate, eda]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --verify-tag
          --generate-notes
          --prerelease
          --title "ZLang HDL ${TAG}"
