name: Set up PDF inspection tools
description: Install Poppler and QPDF for fail-closed manual-set validation.

runs:
  using: composite
  steps:
    - name: Install Poppler inspection commands
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends poppler-utils qpdf
        command -v pdfinfo
        command -v pdfimages
        command -v qpdf
        dpkg-query --show --showformat='poppler-utils=${Version}\n' poppler-utils
