schema = 2

[projection]
manifest = ".public-tree-manifest.json"
repository = "https://github.com/postoroniy/zlang-hdl"

# A release snapshot is intentionally smaller than the private development tree.
# Entries are repository-relative POSIX paths; ``**`` matches recursively.
include = [
  ".gitattributes",
  ".gitleaks.toml",
  ".qwen/skills/zlang-hdl/**",
  ".github/**",
  ".gitignore",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/**",
  "Makefile",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "RELEASING.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "editors/vscode/zlang-hdl/**",
  "examples/**",
  "pyproject.toml",
  "release/**",
  "setup.py",
  "stdlib/**",
  "tests/**",
  "tools/**",
  "zlang/**",

  # The Community user-documentation surface is deliberately compact. Legal
  # and edition policy remain separate; all language/tooling guidance is in the
  # complete reference and its concise companion.
  "docs/editions.md",
  "docs/language-reference.md",
  "docs/language-quick-reference.md",
  "docs/ZLang-HDL-Language-Reference.pdf",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/PUBLIC_RELEASE_CHECKLIST.md",
  "docs/licensing/README.md",
  "docs/project-scope.md",
  "docs/reproducers/**",
]

exclude = [
  "**/.DS_Store",
  "**/.mypy_cache/**",
  "**/.npmrc",
  "**/.pytest_cache/**",
  "**/.qwen/**",
  "**/.ruff_cache/**",
  "**/.vscode-test/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.swp",
  "**/*.vsix",
  "**/*~",
  "*.vsix",
  ".codex/**",
  ".npmrc",
  ".pytest-tmp/**",
  ".tmp/**",
  ".venv/**",
  ".vscode/**",
  ".vscode-test/**",
  "AGENTS.md",
  "Dockerfile.coding-agent",
  "Modelfile.qwen38-256k",
  "current-task.md",
  "decisions.md",
  "docs/*design-freeze*.md",
  "docs/*review*.md",
  "docs/assets/**",
  "docs/[m]ilestone-*.md",
  "docs/qwen-*.md",
  "editors/vscode/zlang-hdl/.tmp/**",
  "editors/vscode/zlang-hdl/build/**",
  "editors/vscode/zlang-hdl/dist/**",
  "editors/vscode/zlang-hdl/out/**",
  "examples/comparisons/**",
  "examples/projects/80211ad_phylayer/**",
  "tests/lsp/test_private_80211ad_navigation.py",
  "luna-report.md",
  "node_modules/**",
  "sol-review.md",
]

required = [
  ".github/CODEOWNERS",
  ".github/dependabot.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/dependency-review.yml",
  ".github/workflows/eda.yml",
  ".github/workflows/release.yml",
  ".github/workflows/secret-scan.yml",
  ".gitleaks.toml",
  ".qwen/skills/zlang-hdl/SKILL.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/Apache-2.0.txt",
  "LICENSES/CC-BY-4.0.txt",
  "LICENSES/MIT.txt",
  "Makefile",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "RELEASING.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "docs/language-reference.md",
  "docs/language-quick-reference.md",
  "docs/ZLang-HDL-Language-Reference.pdf",
  "docs/editions.md",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/PUBLIC_RELEASE_CHECKLIST.md",
  "docs/licensing/README.md",
  "docs/project-scope.md",
  "editors/vscode/zlang-hdl/package.json",
  "examples/all_syntax.zhl",
  "examples/projects/80211a_transmitter/LICENSE",
  "examples/projects/80211a_transmitter/NOTICE",
  "pyproject.toml",
  "release/PUBLICATION.md",
  "release/status.json",
  "setup.py",
  "tools/public_tree.py",
  "tools/release_status.py",
  "zlang/__init__.py",
]

# Every public source/test fixture is intentionally retained.  This protects
# against shrinking the release by silently dropping inconvenient tests.
closure_roots = [
  ".qwen/skills/zlang-hdl",
  "docs/reproducers",
  "editors/vscode/zlang-hdl",
  "examples",
  "stdlib",
  "tests",
  "tools",
  "zlang",
]

[content]
scan_exempt = [
  "release/public-tree.toml",
]

forbidden_substrings = [
  "/home/slava/",
  "agent/qwen",
  "zlang-qwen",
  "current-task.md",
  "luna-report.md",
  "sol-review.md",
]

forbidden_regex = [
  "AKIA[0-9A-Z]{16}",
  "github_pat_[A-Za-z0-9_]{20,}",
  "gh[oprsu]_[A-Za-z0-9]{30,}",
  "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
]

# Binary publication is path-exact rather than extension-wide. The PDF is a
# reviewed release artifact; authoring templates and build collateral are not
# part of the Community tree.
binary_files = [
  "docs/ZLang-HDL-Language-Reference.pdf",
]
binary_max_bytes = 20971520

# Text/source formats admitted to the public projection.  Unknown binary files
# fail closed and must be reviewed before they are added here.
text_extensions = [
  "",
  ".architecture",
  ".bsv",
  ".cjs",
  ".costs",
  ".hs",
  ".in",
  ".implementations",
  ".js",
  ".json",
  ".lark",
  ".lock",
  ".md",
  ".opt",
  ".pipeline",
  ".py",
  ".saturation",
  ".sv",
  ".synthesis",
  ".toml",
  ".txt",
  ".yml",
  ".yaml",
  ".zhl",
]
