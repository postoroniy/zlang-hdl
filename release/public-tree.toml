schema = 1

[projection]
manifest = ".public-tree-manifest.json"
repository = "https://github.com/postoroniy/zlang-hdl"

# A release snapshot is intentionally smaller than the private development tree.
# Entries are repository-relative POSIX paths; ``**`` matches recursively.
include = [
  ".gitattributes",
  ".gitleaks.toml",
  ".github/**",
  ".gitignore",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/**",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "RELEASING.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "editors/vscode/zlang-hdl/**",
  "examples/**",
  "pyproject.toml",
  "release/**",
  "setup.py",
  "stdlib/**",
  "tests/**",
  "tools/**",
  "zlang/**",

  # Live product/user documentation.  Historical milestone reviews and design
  # freezes remain in private development history, not in the public snapshot.
  "docs/80211a-controller-contract.md",
  "docs/80211a-convolutional-encoder-contract.md",
  "docs/80211a-ifft64-contract.md",
  "docs/80211a-interleaver-contract.md",
  "docs/80211a-mapper-contract.md",
  "docs/80211a-transmitter-validation.md",
  "docs/backends-tooling.md",
  "docs/compositional-formal-binding.md",
  "docs/current-language-status.md",
  "docs/direct-systemverilog.md",
  "docs/dma-validation.md",
  "docs/editions.md",
  "docs/expressions-functions-generics.md",
  "docs/fft512-validation.md",
  "docs/fixed-fir-architecture-validation.md",
  "docs/fixed-point-types.md",
  "docs/generated-source-maps.md",
  "docs/getting-started.md",
  "docs/hierarchy-protocols.md",
  "docs/high-level-target-aware-architecture-pipeline-planner.md",
  "docs/implementation-profiles.md",
  "docs/language-guide.md",
  "docs/language-quick-reference.md",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/PUBLIC_RELEASE_CHECKLIST.md",
  "docs/licensing/README.md",
  "docs/low-level-target-resource-library.md",
  "docs/known-limitations.md",
  "docs/named-module-interfaces.md",
  "docs/optimization-formal.md",
  "docs/parameterized-aggregate-protocol.md",
  "docs/physical-clock-reset-contract.md",
  "docs/platform-constraint-publication.md",
  "docs/project-scope.md",
  "docs/projects-dependencies.md",
  "docs/sequential-state-storage.md",
  "docs/source-identity-migration.md",
  "docs/standard-bus-library.md",
  "docs/stdlib-and-real-design-validation.md",
  "docs/stdlib.md",
  "docs/storage-instance-arrays.md",
  "docs/structured-diagnostics.md",
  "docs/syntax-support-matrix.md",
  "docs/tagged-unions.md",
  "docs/target-platform-architecture-description.md",
  "docs/testing.md",
  "docs/types-and-numerics.md",
  "docs/whole-build-manifests.md",
  "docs/reproducers/**",
]

exclude = [
  "**/.DS_Store",
  "**/.mypy_cache/**",
  "**/.npmrc",
  "**/.pytest_cache/**",
  "**/.qwen/**",
  "**/.ruff_cache/**",
  "**/.vscode-test/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.swp",
  "**/*.vsix",
  "**/*~",
  "*.vsix",
  ".codex/**",
  ".npmrc",
  ".pytest-tmp/**",
  ".qwen/**",
  ".tmp/**",
  ".venv/**",
  ".vscode/**",
  ".vscode-test/**",
  "AGENTS.md",
  "Dockerfile.coding-agent",
  "Modelfile.qwen38-256k",
  "current-task.md",
  "decisions.md",
  "docs/*design-freeze*.md",
  "docs/*review*.md",
  "docs/assets/**",
  "docs/milestone-*.md",
  "docs/qwen-*.md",
  "editors/vscode/zlang-hdl/.tmp/**",
  "editors/vscode/zlang-hdl/build/**",
  "editors/vscode/zlang-hdl/dist/**",
  "editors/vscode/zlang-hdl/out/**",
  "examples/comparisons/**",
  "luna-report.md",
  "node_modules/**",
  "sol-review.md",
]

required = [
  ".github/CODEOWNERS",
  ".github/dependabot.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/dependency-review.yml",
  ".github/workflows/eda.yml",
  ".github/workflows/release.yml",
  ".github/workflows/secret-scan.yml",
  ".gitleaks.toml",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/Apache-2.0.txt",
  "LICENSES/CC-BY-4.0.txt",
  "LICENSES/MIT.txt",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "RELEASING.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "docs/getting-started.md",
  "docs/language-guide.md",
  "docs/known-limitations.md",
  "docs/editions.md",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/PUBLIC_RELEASE_CHECKLIST.md",
  "docs/licensing/README.md",
  "docs/project-scope.md",
  "docs/source-identity-migration.md",
  "docs/syntax-support-matrix.md",
  "editors/vscode/zlang-hdl/package.json",
  "examples/all_syntax.zhl",
  "examples/projects/80211a_transmitter/LICENSE",
  "examples/projects/80211a_transmitter/NOTICE",
  "pyproject.toml",
  "release/PUBLICATION.md",
  "release/status.json",
  "setup.py",
  "tools/public_tree.py",
  "tools/release_status.py",
  "zlang/__init__.py",
]

# Every public source/test fixture is intentionally retained.  This protects
# against shrinking the release by silently dropping inconvenient tests.
closure_roots = [
  "docs/reproducers",
  "editors/vscode/zlang-hdl",
  "examples",
  "stdlib",
  "tests",
  "tools",
  "zlang",
]

[content]
scan_exempt = [
  "release/public-tree.toml",
]

forbidden_substrings = [
  "/home/slava/",
  "agent/qwen",
  "zlang-qwen",
  "current-task.md",
  "luna-report.md",
  "sol-review.md",
]

forbidden_regex = [
  "AKIA[0-9A-Z]{16}",
  "github_pat_[A-Za-z0-9_]{20,}",
  "gh[oprsu]_[A-Za-z0-9]{30,}",
  "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
]

# Text/source formats admitted to the public projection.  Unknown binary files
# fail closed and must be reviewed before they are added here.
text_extensions = [
  "",
  ".architecture",
  ".bsv",
  ".cjs",
  ".costs",
  ".hs",
  ".in",
  ".implementations",
  ".json",
  ".lark",
  ".lock",
  ".md",
  ".opt",
  ".pipeline",
  ".py",
  ".saturation",
  ".sv",
  ".synthesis",
  ".toml",
  ".txt",
  ".yml",
  ".yaml",
  ".zhl",
]
