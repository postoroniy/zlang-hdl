schema = 1

[projection]
manifest = ".public-tree-manifest.json"
repository = "https://github.com/postoroniy/zlang-hdl"

# A release snapshot is intentionally smaller than the private development tree.
# Entries are repository-relative POSIX paths; ``**`` matches recursively.
include = [
  ".gitattributes",
  ".gitleaks.toml",
  ".qwen/skills/zlang-hdl/**",
  ".github/**",
  ".gitignore",
  "AI_GUIDE.md",
  "CHANGELOG.md",
  "benchmarks/native_jit/large_combinational.zhl",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/**",
  "Makefile",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "editors/vscode/zlang-hdl/**",
  "examples/**",
  "pyproject.toml",
  "release/native-wheels/**",
  "release/regressions.json",
  "release/native-vulnerability-exceptions.json",
  "release/public-tree.toml",
  "release/status.json",
  "setup.py",
  "stdlib/**",
  "tests/**",
  "tools/**",
  "zlang/**",

  # Community carries three maintained Markdown guides and one PDF.
  # Separate design/build collateral remains on the release host.
  "docs/language-quick-reference.md",
  "docs/formal-verification.md",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/README.md",
  "docs/release-process.md",
  "docs/reproducers/**",
  "docs/stdlib-formal-coverage.md",
  "docs/language-reference.md",
  "docs/ZLang-HDL-Language-Reference.pdf",
]

exclude = [
  "**/.DS_Store",
  "**/.mypy_cache/**",
  "**/.npmrc",
  "**/.pytest_cache/**",
  ".pytest_cache/**",
  "**/.qwen/**",
  "**/.ruff_cache/**",
  ".ruff_cache/**",
  "**/.vscode-test/**",
  "**/__pycache__/**",
  "__pycache__/**",
  "**/node_modules/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.swp",
  "**/*.vsix",
  "**/_zlang_jit.*.so",
  "**/_zlang_native_sim.*.so",
  "**/*~",
  "*.vsix",
  ".codex/**",
  ".tmp-public-tests-*/**",
  ".tmp-zagent-*/**",
  ".npmrc",
  ".pytest-tmp/**",
  ".tmp/**",
  ".venv/**",
  ".worktrees/**",
  ".vscode/**",
  ".vscode-test/**",
  "AGENTS.md",
  "build/**",
  "Dockerfile.coding-agent",
  "Modelfile.qwen38-256k",
  "current-task.md",
  "decisions.md",
  "docs/*design-freeze*.md",
  "docs/*review*.md",
  "docs/editions.md",
  "docs/assets/**",
  "docs/[m]ilestone-*.md",
  "docs/qwen-*.md",
  "editors/vscode/zlang-hdl/.tmp/**",
  "editors/vscode/zlang-hdl/build/**",
  "editors/vscode/zlang-hdl/dist/**",
  "editors/vscode/zlang-hdl/out/**",
  "examples/comparisons/**",
  "examples/*.numbered-development",
  "examples/projects/80211ad_phylayer/**",
  "examples/projects/80211ad_phylayer_from_public/**",
  "examples/structural/test.zhl",
  "PixelSwizzlerMuxWitness_recovered.zhl",
  "tests/fixtures/pixel_swizzler_unassisted.zhl",
  "tests/integration/test_pixel_functional_region_qor.py",
  "tests/semantic/test_functional_generic_lifting.py",
  "tests/**/*_m[0-9]*.py",
  "tests/**/test_m[0-9]*_*.py",
  "tests/*_m[0-9]*.py",
  "tests/test_m[0-9]*_*.py",
  "tests/lsp/test_private_80211ad_navigation.py",
  "tests/release/test_community_pdf.py",
  "tests/release/test_native_runtime_audit.py",
  "tests/release/test_public_tree.py",
  "tools/build_community_pdf.py",
  "tools/audit_native_runtime.py",
  "zlang/simulate.py",
  "zlang/simulation_reference.py",
  "luna-report.md",
  "native-runtime/**",
  "node_modules/**",
  "target/**",
  "sol-review.md",
]

required = [
  ".github/CODEOWNERS",
  ".github/dependabot.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/daily-regression.yml",
  ".github/workflows/dependency-review.yml",
  ".github/workflows/eda.yml",
  ".github/workflows/release.yml",
  ".github/workflows/secret-scan.yml",
  ".gitleaks.toml",
  ".qwen/skills/zlang-hdl/SKILL.md",
  ".qwen/skills/zlang-hdl/references/types-and-interfaces.md",
  "AI_GUIDE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSES/Apache-2.0.txt",
  "LICENSES/BSD-3-Clause.txt",
  "LICENSES/CC-BY-4.0.txt",
  "LICENSES/MIT.txt",
  "Makefile",
  "MANIFEST.in",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "SUPPORT.md",
  "TRADEMARKS.md",
  "docs/language-reference.md",
  "docs/language-quick-reference.md",
  "docs/formal-verification.md",
  "docs/ZLang-HDL-Language-Reference.pdf",
  "docs/licensing/COMMUNITY_BASELINE.md",
  "docs/licensing/GENERATED_OUTPUT_POLICY.md",
  "docs/licensing/IP_CLASSIFICATION.md",
  "docs/licensing/README.md",
  "docs/release-process.md",
  "docs/stdlib-formal-coverage.md",
  "editors/vscode/zlang-hdl/package.json",
  "examples/all_syntax.zhl",
  "examples/structural/scatter_12x4x4.zhl",
  "examples/projects/80211a_transmitter/LICENSE",
  "examples/projects/80211a_transmitter/NOTICE",
  "pyproject.toml",
  "release/status.json",
  "release/regressions.json",
  "release/native-vulnerability-exceptions.json",
  "release/public-tree.toml",
  "setup.py",
  "tools/audit_native_binary.py",
  "tools/audit_native_vulnerabilities.py",
  "tools/audit_editor_vulnerabilities.py",
  "tools/audit_review_commits.py",
  "tools/release_status.py",
  "tools/random_regression.py",
  "tools/release_preflight.py",
  "tools/release_regressions.py",
  "tools/public_tree.py",
  "tools/stage_release_pdf.py",
  "tests/backend/test_wide_scatter_emission.py",
  "zlang/__init__.py",
  "zlang/native_simulation.py",
]

# Every public source/test fixture is intentionally retained.  This protects
# against shrinking the release by silently dropping inconvenient tests.
closure_roots = [
  ".qwen/skills/zlang-hdl",
  "docs/reproducers",
  "editors/vscode/zlang-hdl",
  "examples",
  "stdlib",
  "tests",
  "tools",
  "zlang",
]

[content]
scan_exempt = [
  "release/public-tree.toml",
]

forbidden_substrings = [
  "/home/slava/",
  "agent/qwen",
  "zlang-qwen",
  "current-task.md",
  "luna-report.md",
  "sol-review.md",
]

forbidden_regex = [
  "AKIA[0-9A-Z]{16}",
  "github_pat_[A-Za-z0-9_]{20,}",
  "gh[oprsu]_[A-Za-z0-9]{30,}",
  "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
  "(?i)pixel",
]

# Text/source formats admitted to the public projection.  Unknown binary files
# fail closed and must be reviewed before they are added here.
text_extensions = [
  "",
  ".architecture",
  ".bsv",
  ".cjs",
  ".costs",
  ".hs",
  ".in",
  ".implementations",
  ".js",
  ".json",
  ".jsonl",
  ".lark",
  ".license",
  ".lock",
  ".md",
  ".opt",
  ".pipeline",
  ".py",
  ".sh",
  ".saturation",
  ".sv",
  ".synthesis",
  ".toml",
  ".txt",
  ".yml",
  ".yaml",
  ".zhl",
]

# Reviewed generated artifacts are admitted by exact path, never by extension.
# LaTeX sources, the cover image and temporary build products remain outside the
# Community projection.
reviewed_binary_files = [
  "docs/ZLang-HDL-Language-Reference.pdf",
  "zlang/parser/lalr-1.3.1.larkbin",
  "release/native-wheels/zlang_native_sim-0.1.0a21-cp312-abi3-manylinux_2_28_x86_64.whl",
]
