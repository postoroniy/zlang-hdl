[extend]
useDefault = true

# The default generic-api-key rule also matches "api" in these documentation
# filenames. These whole JSON fields contain source SHA-256 digests, not keys.
# Inherit the default rule; do not exempt the file, other fields or other rules.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Documentation source hashes in the release inventory"
condition = "AND"
regexTarget = "line"
paths = ['''^release/status\.json$''']
regexes = ['''^\s*"docs/(stdlib-api|tooling-integration-api)\.md": "[0-9a-f]{64}",?\s*$''']

# A global path allowlist skips the entire file in Gitleaks 8.24.3, regardless
# of a global condition. Restrict this existing exception to the matched hash.
[[rules.allowlists]]
description = "Deterministic non-secret synthesis cache hashes"
condition = "AND"
regexTarget = "match"
paths = ['''^examples/generated/CostMac\.synthesis$''']
regexes = ['''^cache_key=[0-9a-f]{64}\s*$''']

# Gitleaks treats "access" in this compiler filename as an API-key label.
# Permit only the reviewed source SHA on its complete inventory line; other
# values, fields, paths and default rules remain subject to normal scanning.
[[rules.allowlists]]
description = "Exact reviewed compiler source digest in FPGA qualification"
condition = "AND"
regexTarget = "line"
paths = ['''^release/fpga-qualification\.json$''']
regexes = ['''^\s*"simulation_protocol_access\.py": "ebecd0833cf7a6bfd83a1ff78c1ad6235349e2b13c9fa7304ca81e175cf9faab",?\s*$''']
